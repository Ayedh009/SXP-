name: SPX Bot

on:
  schedule:
    - cron: "7 13 * * 1-5"
    - cron: "7 14 * * 1-5"
    - cron: "47 16 * * 1-5"
    - cron: "47 17 * * 1-5"
  workflow_dispatch:
    inputs:
      test_minutes:
        description: "تشغيل تجريبي بالدقائق (اتركه فارغاً للتشغيل العادي)"
        required: false
        default: ""

concurrency:
  group: spx-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: spx-state-${{ github.run_id }}
          restore-keys: spx-state-

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CI_WINDOWS: "1"
          TEST_MINUTES: ${{ github.event.inputs.test_minutes }}
        run: python spx_bot.py

      - uses: actions/cache/save@v4
        if: always() && hashFiles('state.json') != ''
        with:
          path: state.json
          key: spx-state-${{ github.run_id }}

      - name: Save stats (trade and prediction logs)
        if: always()
        run: |
          if [ -d stats ] && [ -n "$(git status --porcelain stats)" ]; then
            git config user.name "spx-bot"
            git config user.email "spx-bot@users.noreply.github.com"
            git add stats
            git commit -m "stats $(date -u +%F)"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push || true
          fi

      - name: Failure alert
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          IFS=',' read -ra IDS <<< "$TELEGRAM_CHAT_ID"
          for id in "${IDS[@]}"; do
            id=$(echo "$id" | xargs)
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${id}" \
              --data-urlencode "text=⚠️ توقف بوت SPX بسبب خطأ في GitHub Actions. راجع تبويب Actions في المستودع." > /dev/null
          done
